<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ronda de Salas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141c;
    --panel:#1b1f2b;
    --panel-2:#20253340;
    --line: rgba(244,239,228,0.10);
    --line-strong: rgba(244,239,228,0.22);
    --ink:#f4efe4;
    --ink-dim:#9b9690;
    --accent:#f2a93b;
    --accent-ink:#241705;
    --ok:#57b37a;
    --ok-ink:#08210f;
    --warn:#d64545;
    --warn-ink:#2a0000;
    --occupied:var(--accent);
    --occupied-ink:var(--accent-ink);
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--display);
    min-height:100vh;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  /* ---------- Header ---------- */
  header.board{
    padding:22px 18px 14px;
    border-bottom:1px solid var(--line-strong);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
  }
  .board-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .board-title h1{
    margin:0;
    font-size:22px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:700;
  }
  .board-date{
    font-family:var(--mono);
    font-size:13px;
    color:var(--accent);
    white-space:nowrap;
  }
  .board-sub{
    margin-top:4px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    gap:8px;
    padding:14px 16px 4px;
    overflow-x:auto;
  }
  nav.tabs button{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.03em;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  nav.tabs button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
  }
  nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Room list ---------- */
  main{padding:10px 16px 18px;}
  .room-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 12px;
    margin-bottom:10px;
  }
  .room-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .room-name{
    font-size:17px;
    font-weight:600;
  }
  .room-time{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .status-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .status-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:11px 8px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    min-height:44px;
  }
  .status-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-dim);flex:0 0 auto;}
  .status-btn.ok.selected{background:var(--ok);border-color:var(--ok);color:var(--ok-ink);}
  .status-btn.ok.selected .dot{background:var(--ok-ink);}
  .status-btn.warn.selected{background:var(--warn);border-color:var(--warn);color:var(--warn-ink);}
  .status-btn.warn.selected .dot{background:var(--warn-ink);}
  .status-btn.occupied.selected{background:var(--occupied);border-color:var(--occupied);color:var(--occupied-ink);}
  .status-btn.occupied.selected .dot{background:var(--occupied-ink);}
  .status-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  textarea.note{
    width:100%;
    resize:vertical;
    min-height:38px;
    background:#00000030;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-family:var(--display);
    font-size:13.5px;
    padding:9px 10px;
  }
  textarea.note::placeholder{color:var(--ink-dim);}
  textarea.note:focus-visible{outline:2px solid var(--accent);}

  .empty-floor{
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:13px;
    padding:24px 4px;
    text-align:center;
  }

  /* ---------- Footer ---------- */
  footer.bar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--panel);
    border-top:1px solid var(--line-strong);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:12px;
  }
  .progress-wrap{flex:1;}
  .progress-label{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
    margin-bottom:5px;
  }
  .progress-track{
    height:5px;
    border-radius:3px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:3px;
    transition:width .25s ease;
  }
  .btn-report{
    flex:0 0 auto;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
    padding:12px 16px;
    cursor:pointer;
    min-height:44px;
  }
  .btn-report:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  /* ---------- Report modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:#00000090;
    display:none;
    align-items:flex-end;
    z-index:20;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:100%;
    max-height:90vh;
    background:var(--bg);
    border-radius:16px 16px 0 0;
    border-top:1px solid var(--line-strong);
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 16px 8px;
  }
  .modal-head h2{margin:0;font-size:17px;}
  .modal-close{
    background:transparent;border:none;color:var(--ink-dim);
    font-size:22px;line-height:1;cursor:pointer;padding:6px;
  }
  .day-chips{
    display:flex;gap:7px;
    padding:6px 16px 12px;
    overflow-x:auto;
  }
  .day-chip{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:12px;
    padding:7px 11px;
    border-radius:999px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .day-chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .report-body{
    flex:1;
    overflow-y:auto;
    padding:0 16px 12px;
  }
  pre.report-text{
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin:0;
  }
  .modal-actions{
    display:flex;gap:10px;
    padding:12px 16px 16px;
  }
  .btn-copy{
    flex:1;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:14.5px;
    padding:13px;
    cursor:pointer;
    min-height:46px;
  }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--ink);
    border-radius:8px;
    font-size:14.5px;
    padding:13px 16px;
    cursor:pointer;
    min-height:46px;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;bottom:96px;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:var(--bg);
    font-family:var(--display);
    font-size:13.5px;
    font-weight:600;
    padding:10px 16px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:30;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .progress-fill,.toast{transition:none;}
  }
</style>
</head>
<body>

<header class="board">
  <div class="board-title">
    <h1>Ronda de Salas</h1>
    <div class="board-date" id="headerDate">--/--</div>
  </div>
  <div class="board-sub" id="headerSub">carregando…</div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="roomList"></main>

<footer class="bar">
  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">0/0 salas verificadas</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <button class="btn-report" id="openReportBtn">Relatório</button>
</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Relatório</h2>
      <button class="modal-close" id="closeReportBtn" aria-label="Fechar">&times;</button>
    </div>
    <div class="day-chips" id="dayChips"></div>
    <div class="report-body">
      <pre class="report-text" id="reportText">Carregando…</pre>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="closeReportBtn2">Fechar</button>
      <button class="btn-copy" id="copyReportBtn">Copiar relatório</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const ROOMS = [
    {id:'nairobi',  name:'Nairóbi',  floor:'Térreo'},
    {id:'acra',     name:'Acra',     floor:'Térreo'},
    {id:'cairo',    name:'Cairo',    floor:'Térreo'},
    {id:'adelaide', name:'Adelaide', floor:'1º andar'},
    {id:'sydney',   name:'Sydney',   floor:'1º andar'},
    {id:'barcelona',name:'Barcelona',floor:'2º andar'},
    {id:'berlim',   name:'Berlim',   floor:'2º andar'},
    {id:'londres',  name:'Londres',  floor:'2º andar'},
    {id:'roma',     name:'Roma',     floor:'2º andar'},
    {id:'pequim',   name:'Pequim',   floor:'4º andar'},
    {id:'seul',     name:'Seul',     floor:'4º andar'},
    {id:'toquio',   name:'Tóquio',   floor:'4º andar'},
  ];
  const FLOORS = ['Térreo','1º andar','2º andar','4º andar'];
  const WEEKDAYS = ['dom','seg','ter','qua','qui','sex','sáb'];

  const state = {
    date: todayKey(),
    checkins: {},   // { roomId: {status:'ok'|'occupied'|'warn', note:'', time:'HH:MM'} }
    activeFloor: FLOORS[0],
    loading: true,
  };

  function todayKey(d){
    const dt = d || new Date();
    return dt.toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
  }

  function formatHeaderDate(dateStr){
    const [y,m,d] = dateStr.split('-');
    return `${d}/${m}`;
  }

  function formatChipLabel(dateStr, todayStr){
    if(dateStr === todayStr) return 'Hoje';
    const dt = new Date(dateStr+'T12:00:00');
    const yestDt = new Date(todayStr+'T12:00:00');
    yestDt.setDate(yestDt.getDate()-1);
    if(dateStr === todayKey(yestDt)) return 'Ontem';
    return WEEKDAYS[dt.getDay()] + ' ' + dateStr.slice(8,10) + '/' + dateStr.slice(5,7);
  }

  function nowTime(){
    return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }

  // ---------- storage (localStorage do navegador) ----------
  async function loadDay(dateStr){
    try{
      const raw = localStorage.getItem('day:'+dateStr);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      return {};
    }
  }

  async function saveDay(dateStr, data){
    try{
      localStorage.setItem('day:'+dateStr, JSON.stringify(data));
    }catch(e){
      showToast('Não foi possível salvar (armazenamento do navegador indisponível).');
    }
  }

  async function listRecentDays(){
    try{
      const days = Object.keys(localStorage)
        .filter(k => k.startsWith('day:'))
        .map(k => k.replace('day:',''))
        .sort().reverse();
      const set = new Set(days);
      set.add(state.date);
      return Array.from(set).sort().reverse().slice(0,7);
    }catch(e){
      return [state.date];
    }
  }

  // ---------- render: tabs ----------
  function renderTabs(){
    const nav = document.getElementById('tabs');
    nav.innerHTML = '';
    FLOORS.forEach(floor=>{
      const btn = document.createElement('button');
      btn.textContent = floor;
      if(floor === state.activeFloor) btn.classList.add('active');
      btn.addEventListener('click', ()=>{
        state.activeFloor = floor;
        renderTabs();
        renderRooms();
      });
      nav.appendChild(btn);
    });
  }

  // ---------- render: room list ----------
  function renderRooms(){
    const main = document.getElementById('roomList');
    main.innerHTML = '';
    const rooms = ROOMS.filter(r => r.floor === state.activeFloor);
    if(rooms.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-floor';
      empty.textContent = 'Nenhuma sala de reunião neste andar.';
      main.appendChild(empty);
      return;
    }
    rooms.forEach(room=>{
      main.appendChild(renderRoomCard(room));
    });
    renderProgress();
  }

  function renderRoomCard(room){
    const entry = state.checkins[room.id] || {};
    const card = document.createElement('div');
    card.className = 'room-card';

    const head = document.createElement('div');
    head.className = 'room-head';
    const name = document.createElement('div');
    name.className = 'room-name';
    name.textContent = room.name;
    head.appendChild(name);
    const time = document.createElement('div');
    time.className = 'room-time';
    time.textContent = entry.time ? entry.time : '';
    head.appendChild(time);
    card.appendChild(head);

    const statusRow = document.createElement('div');
    statusRow.className = 'status-row';

    const okBtn = document.createElement('button');
    okBtn.className = 'status-btn ok' + (entry.status === 'ok' ? ' selected' : '');
    okBtn.innerHTML = '<span class="dot"></span> Tudo certo';
    okBtn.addEventListener('click', ()=> toggleStatus(room.id, 'ok'));

    const occupiedBtn = document.createElement('button');
    occupiedBtn.className = 'status-btn occupied' + (entry.status === 'occupied' ? ' selected' : '');
    occupiedBtn.innerHTML = '<span class="dot"></span> Sala Ocupada';
    occupiedBtn.addEventListener('click', ()=> toggleStatus(room.id, 'occupied'));

    const warnBtn = document.createElement('button');
    warnBtn.className = 'status-btn warn' + (entry.status === 'warn' ? ' selected' : '');
    warnBtn.innerHTML = '<span class="dot"></span> Cabos desorganizados';
    warnBtn.addEventListener('click', ()=> toggleStatus(room.id, 'warn'));

    statusRow.appendChild(okBtn);
    statusRow.appendChild(occupiedBtn);
    statusRow.appendChild(warnBtn);
    card.appendChild(statusRow);

    const note = document.createElement('textarea');
    note.className = 'note';
    note.placeholder = 'Observação (opcional)';
    note.value = entry.note || '';
    note.addEventListener('change', ()=>{
      const e = state.checkins[room.id] || {status:null, note:'', time:null};
      e.note = note.value;
      state.checkins[room.id] = e;
      saveDay(state.date, state.checkins);
    });
    card.appendChild(note);

    return card;
  }

  function toggleStatus(roomId, status){
    const current = state.checkins[roomId] || {};
    if(current.status === status){
      // undo
      current.status = null;
      current.time = null;
    } else {
      current.status = status;
      current.time = nowTime();
    }
    if(current.note === undefined) current.note = '';
    state.checkins[roomId] = current;
    saveDay(state.date, state.checkins);
    renderRooms();
  }

  function renderProgress(){
    const total = ROOMS.length;
    const done = ROOMS.filter(r => state.checkins[r.id] && state.checkins[r.id].status).length;
    document.getElementById('progressLabel').textContent = `${done}/${total} salas verificadas`;
    document.getElementById('progressFill').style.width = total ? `${(done/total)*100}%` : '0%';
  }

  // ---------- report ----------
  function buildReportText(dateStr, checkins){
    const dt = new Date(dateStr+'T12:00:00');
    const dateLabel = dt.toLocaleDateString('pt-BR');
    const lines = [];
    lines.push(`Verificação de Salas – ${dateLabel}`);
    let problems = 0, checked = 0;
    FLOORS.forEach(floor=>{
      const rooms = ROOMS.filter(r=>r.floor===floor);
      if(rooms.length === 0) return;
      lines.push('');
      lines.push(floor);
      rooms.forEach(room=>{
        const e = checkins[room.id];
        if(!e || !e.status){
          lines.push(`  [ ] ${room.name} – não verificada`);
          return;
        }
        checked++;
        if(e.status === 'ok'){
          lines.push(`  [✅] ${room.name} – tudo certo (${e.time || '--:--'})`);
        } else if(e.status === 'occupied'){
          lines.push(`  [🟡] ${room.name} – sala ocupada durante a verificação (${e.time || '--:--'})`);
        } else {
          problems++;
          lines.push(`  [🔌❌] ${room.name} – cabos desorganizados (${e.time || '--:--'})`);
        }
        if(e.note && e.note.trim()){
          lines.push(`       obs: ${e.note.trim()}`);
        }
      });
    });
    lines.splice(1, 0, `${checked}/${ROOMS.length} verificadas · ${problems} com problema`);
    return lines.join('\n');
  }

  let currentReportDate = null;

  async function openReport(){
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('reportText').textContent = 'Carregando…';
    const days = await listRecentDays();
    currentReportDate = state.date;
    renderDayChips(days);
    await showReportFor(state.date);
  }

  function renderDayChips(days){
    const wrap = document.getElementById('dayChips');
    wrap.innerHTML = '';
    days.forEach(d=>{
      const chip = document.createElement('button');
      chip.className = 'day-chip' + (d === currentReportDate ? ' active' : '');
      chip.textContent = formatChipLabel(d, state.date);
      chip.addEventListener('click', async ()=>{
        currentReportDate = d;
        renderDayChips(days);
        await showReportFor(d);
      });
      wrap.appendChild(chip);
    });
  }

  async function showReportFor(dateStr){
    const data = dateStr === state.date ? state.checkins : await loadDay(dateStr);
    const hasAny = Object.keys(data).length > 0;
    document.getElementById('reportText').textContent = hasAny || dateStr === state.date
      ? buildReportText(dateStr, data)
      : 'Nenhuma sala verificada nesse dia.';
  }

  function closeReport(){
    document.getElementById('modalOverlay').classList.remove('open');
  }

  async function copyReport(){
    const text = document.getElementById('reportText').textContent;
    try{
      await navigator.clipboard.writeText(text);
      showToast('Relatório copiado!');
    }catch(e){
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{
        document.execCommand('copy');
        showToast('Relatório copiado!');
      }catch(e2){
        showToast('Não foi possível copiar. Selecione o texto manualmente.');
      }
      document.body.removeChild(ta);
    }
  }

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
  }

  // ---------- init ----------
  async function init(){
    document.getElementById('headerDate').textContent = formatHeaderDate(state.date);
    renderTabs();
    state.checkins = await loadDay(state.date);
    state.loading = false;
    document.getElementById('headerSub').textContent = 'toque numa sala para registrar a verificação';
    renderRooms();

    document.getElementById('openReportBtn').addEventListener('click', openReport);
    document.getElementById('closeReportBtn').addEventListener('click', closeReport);
    document.getElementById('closeReportBtn2').addEventListener('click', closeReport);
    document.getElementById('copyReportBtn').addEventListener('click', copyReport);
    document.getElementById('modalOverlay').addEventListener('click', (ev)=>{
      if(ev.target.id === 'modalOverlay') closeReport();
    });
  }

  init();
})();
</script>
</body>
</html>
