<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ronda de Salas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="board">
  <div class="board-title">
    <h1>Ronda de Salas</h1>
    <div class="board-date" id="headerDate">--/--</div>
  </div>
  <div class="board-sub" id="headerSub">carregando…</div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="roomList"></main>

<footer class="bar">
  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">0/0 salas verificadas</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <button class="btn-report" id="openReportBtn">Relatório</button>
</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Relatório</h2>
      <button class="modal-close" id="closeReportBtn" aria-label="Fechar">&times;</button>
    </div>
    <div class="day-chips" id="dayChips"></div>
    <div class="report-body">
      <pre class="report-text" id="reportText">Carregando…</pre>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="closeReportBtn2">Fechar</button>
      <button class="btn-copy" id="copyReportBtn">Copiar relatório</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
